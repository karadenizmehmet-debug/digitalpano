# Haber başlıklarını her 30 dakikada bir RSS'ten çekip Firestore'a (config/haber) yazar.
# Site yeniden yayınlanmaz; pano bu belgeyi canlı dinler.
# Gerekli GitHub Secret: FIREBASE_SERVICE_ACCOUNT (Deploy ile aynı).
# Elle de çalıştırılabilir: Actions > Haber > Run workflow
name: Haber
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency:
  group: haber
  cancel-in-progress: true
jobs:
  haber:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Anahtar kontrolü
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret'ı yok, haberler güncellenmedi."
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with: { node-version: 20 }
      - name: Haberleri çek ve Firestore'a yaz
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: node scripts/haber.mjs
