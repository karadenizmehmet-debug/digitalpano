# main dalına her gönderimde pano Firebase Hosting'e de yayınlanır:
# https://digitalpano-84947.web.app (okul ağında github.io açılmadığı için)
# Gerekli GitHub Secret: FIREBASE_SERVICE_ACCOUNT (Firebase > Proje ayarları > Hizmet hesapları > Yeni özel anahtar)
# Elle de çalıştırılabilir: Actions > Deploy > Run workflow
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Anahtar kontrolü
        if: env.SA == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret'ı yok, Firebase yayını atlandı."
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: env.SA != ''
      # GITHUB_PAGES verilmediği için base '/' olur (Firebase kök dizinden açılır)
      - run: npm run build
        if: env.SA != ''
      - name: Firebase Hosting'e yayınla
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('Anahtar OK:',d.get('client_email'))" "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project digitalpano-84947 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
