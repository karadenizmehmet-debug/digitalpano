# main dalına her gönderimde pano Firebase Hosting'e de yayınlanır:
# https://digitalpano-84947.web.app (okul ağında github.io açılmadığı için)
# Gerekli GitHub Secret: FIREBASE_SERVICE_ACCOUNT (Firebase > Proje ayarları > Hizmet hesapları > Yeni özel anahtar)
# Elle de çalıştırılabilir: Actions > Deploy > Run workflow
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'   # MEB haber listesi için her 30 dakikada bir yeniden yayınla
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Anahtar kontrolü
        if: env.SA == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret'ı yok, Firebase yayını atlandı."
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: env.SA != ''
      # GITHUB_PAGES verilmediği için base '/' olur (Firebase kök dizinden açılır)
      - name: MEB haberlerini çek (hata olursa derleme durmaz)
        if: env.SA != ''
        continue-on-error: true
        run: node scripts/haber.mjs
      - run: npm run build
        if: env.SA != ''
      - name: Firebase Hosting'e yayınla
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('Anahtar OK:',d.get('client_email'))" "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@latest deploy --only hosting --project digitalpano-84947 --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$rc" != "0" ]; then
            grep -iE "error|denied|permission|403|enable|not been used" "$RUNNER_TEMP/out.txt" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
