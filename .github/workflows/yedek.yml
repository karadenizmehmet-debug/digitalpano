# Her pazar 03:00'te (TR 06:00) Firestore'daki bütün okulların pano ayarlarını ve görselleri yedek/ klasörüne kaydeder.
# Elle de çalıştırılabilir: Actions > Yedek > Run workflow
name: Yedek
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yedek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firestore'dan çek
        run: |
          set -e
          B="https://firestore.googleapis.com/v1/projects/digitalpano-84947/databases/(default)/documents"
          K="AIzaSyB9mFJzlFR-Bm87jn9WbzHlVu-_kzdN1c4"
          R="Referer: https://karadenizmehmet-debug.github.io/"
          mkdir -p yedek
          curl -fsS -H "$R" "$B/config/pano?key=$K" -o yedek/ayarlar.json
          curl -fsS -H "$R" "$B/images?pageSize=300&key=$K" -o yedek/gorseller.json
          python3 -c "import json;json.load(open('yedek/ayarlar.json'));json.load(open('yedek/gorseller.json'))"
          # Diğer okullar: okullar listesindeki her okul için yedek/ayarlar-<yol>.json
          curl -fsS -H "$R" "$B/okullar?pageSize=300&key=$K" -o /tmp/okullar.json || echo '{}' > /tmp/okullar.json
          for Y in $(python3 -c "import json;d=json.load(open('/tmp/okullar.json'));print(' '.join(x['fields']['yol']['stringValue'] for x in d.get('documents',[]) if x.get('fields',{}).get('yol',{}).get('stringValue')))"); do
            curl -fsS -H "$R" "$B/config/pano-$Y?key=$K" -o "yedek/ayarlar-$Y.json" && echo "Yedeklendi: $Y" || echo "::warning::$Y yedeklenemedi"
          done
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "yedek-bot"
          git config user.email "yedek-bot@users.noreply.github.com"
          git add yedek
          git diff --cached --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "Haftalık yedek $(date +%F)"
          git push
